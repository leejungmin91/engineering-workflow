name: Verify checker

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s plugins/engineering-workflow/skills/engineering-workflow/tests
      - run: python -m pip install -r integrations/discord/requirements.txt
      - run: python -m unittest discover -s integrations/discord
